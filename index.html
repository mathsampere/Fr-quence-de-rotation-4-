

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calcul de la fréquence de rotation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.application {
    width: 100%;
    max-width: 500px;
    background: #222;
    padding: 25px;
    border-radius: 20px;
    border: 2px solid #444;
    text-align: center;
}

h1 {
    color: #ff3333;
    font-size: 27px;
    margin-bottom: 30px;
}

h2 {
    font-size: 19px;
    margin-top: 25px;
    margin-bottom: 15px;
}

.materiaux {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.materiaux button {
    padding: 18px 8px;
    background: #333;
    color: white;
    border: 2px solid #555;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

.materiaux button.actif {
    background: #d90000;
    border-color: #ff5555;
}

.diametre {
    margin-top: 25px;
}

.valeur {
    color: #ff3333;
    font-size: 30px;
    font-weight: bold;
    margin: 15px;
}

input[type="range"] {
    width: 100%;
    height: 35px;
    accent-color: #ff2222;
    cursor: pointer;
}

.resultat {
    margin-top: 30px;
    padding: 25px 10px;
    background: #080808;
    border: 3px solid #e00000;
    border-radius: 15px;
}

.resultat p {
    color: #aaa;
    font-size: 16px;
    margin: 0 0 10px;
}

.vitesse {
    color: #ff3333;
    font-size: clamp(42px, 12vw, 65px);
    font-weight: bold;
}

.unite {
    font-size: 20px;
    color: white;
}

footer {
    margin-top: 25px;
    color: #777;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="application">

    <h1>Calcul de la fréquence de rotation</h1>

    <h2>1. Choisir le matériau</h2>

    <div class="materiaux">
        <button class="actif" onclick="choisir('acier', this)">ACIER</button>
        <button onclick="choisir('fonte', this)">FONTE</button>
        <button onclick="choisir('bronze', this)">BRONZE</button>
        <button onclick="choisir('laiton', this)">LAITON</button>
    </div>

    <h2>2. Diamètre du foret</h2>

    <div class="diametre">
        <div class="valeur">
            <span id="valeurDiametre">10</span> mm
        </div>

        <input
            type="range"
            id="diametre"
            min="1"
            max="50"
            step="0.5"
            value="10"
            oninput="calculer()"
        >
    </div>

    <div class="resultat">
        <p>FRÉQUENCE DE ROTATION</p>

        <div class="vitesse" id="resultat">700</div>

        <div class="unite">tr/min</div>
    </div>

    <footer>
        Calculateur de vitesse de perçage
    </footer>

</div>

<script>

let materiau = "acier";

const vitesses = {
    acier: 22,
    fonte: 22,
    bronze: 50,
    laiton: 60
};

function choisir(m, bouton) {

    materiau = m;

    document.querySelectorAll(".materiaux button")
        .forEach(b => b.classList.remove("actif"));

    bouton.classList.add("actif");

    calculer();
}

function calculer() {

    let d = parseFloat(
        document.getElementById("diametre").value
    );

    let v = vitesses[materiau];

    let f = 1000 * v / (3.14 * d);

    document.getElementById("valeurDiametre").textContent = d;

    document.getElementById("resultat").textContent =
        Math.round(f).toLocaleString("fr-FR");
}

// Calcul initial
calculer();

</script>

</body>
</html>
